<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Achintya Akella: quantum computing, AI, and loud guitar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#14103a"/>
      <stop offset="1" stop-color="#2a0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- qubit wires -->
  <g stroke="#5eead4" stroke-opacity="0.22" stroke-width="2">
    <line x1="640" y1="70"  x2="1200" y2="70"/>
    <line x1="640" y1="130" x2="1200" y2="130"/>
    <line x1="640" y1="190" x2="1200" y2="190"/>
    <line x1="640" y1="250" x2="1200" y2="250"/>
  </g>

  <!-- gates -->
  <g fill="#0b1020" stroke="#5eead4" stroke-width="2" stroke-opacity="0.75">
    <rect x="700" y="52" width="36" height="36" rx="6"/>
    <rect x="860" y="112" width="36" height="36" rx="6"/>
    <rect x="1040" y="172" width="36" height="36" rx="6"/>
    <rect x="780" y="232" width="36" height="36" rx="6"/>
  </g>
  <g fill="#5eead4" font-family="Georgia, 'Times New Roman', serif" font-size="20" text-anchor="middle" font-style="italic">
    <text x="718"  y="77">H</text>
    <text x="878"  y="137">T</text>
    <text x="1058" y="197">H</text>
    <text x="798"  y="257">X</text>
  </g>

  <!-- CNOT 1: control wire 1, target wire 3 -->
  <g stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.9">
    <line x1="960" y1="70" x2="960" y2="190"/>
    <circle cx="960" cy="190" r="14" fill="#0b1020"/>
    <line x1="946" y1="190" x2="974" y2="190"/>
    <line x1="960" y1="176" x2="960" y2="204"/>
  </g>
  <circle cx="960" cy="70" r="6" fill="#f43f5e"/>

  <!-- CNOT 2: control wire 2, target wire 4 -->
  <g stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.9">
    <line x1="1120" y1="130" x2="1120" y2="250"/>
    <circle cx="1120" cy="250" r="14" fill="#0b1020"/>
    <line x1="1106" y1="250" x2="1134" y2="250"/>
    <line x1="1120" y1="236" x2="1120" y2="264"/>
  </g>
  <circle cx="1120" cy="130" r="6" fill="#f43f5e"/>

  <!-- measurement -->
  <g stroke="#5eead4" stroke-opacity="0.75" stroke-width="2" fill="#0b1020">
    <rect x="1000" y="52" width="36" height="36" rx="6"/>
    <path d="M1007 78 A11 11 0 0 1 1029 78" fill="none"/>
    <line x1="1018" y1="78" x2="1027" y2="62"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="120" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Achintya Akella</text>
    <rect x="62" y="142" width="150" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="190" font-size="26" fill="#e2e8f0">Quantum computing  ×  AI  ×  loud guitar</text>
    <text x="60" y="232" font-size="18" fill="#94a3b8" letter-spacing="0.5">B.Tech CS '27 · GITAM · Bengaluru</text>
  </g>
</svg>
